name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pgsql
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: flow
        options: >-
          --health-cmd "pg_isready -U pgsql -d flow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+psycopg://pgsql:rootpassword@localhost:5432/flow
      TEST_DATABASE_URL: postgresql+psycopg://pgsql:rootpassword@localhost:5432/flow_test
      # CI uses a dummy API key — live-model tests are excluded via marker
      GOOGLE_API_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Create test database
        run: |
          PGPASSWORD=rootpassword psql -h localhost -U pgsql -d flow \
            -c "CREATE DATABASE flow_test OWNER pgsql;"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests (excluding live model and integration)
        run: pytest -v -m "not live_model and not integration"
